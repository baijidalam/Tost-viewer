<body>

<div class="container">

    <div class="header">
        <h1>SB DARK TEAM</h1>
        <p>SMALI LAB • DARK EDITION PRO</p>
    </div>

    <div class="input-group">
        <label>ENTER TOAST MESSAGE</label>
        <div class="input-row"><input type="text" id="msgInput" placeholder="Type your message here..."><button type="button" class="btn-clear" onclick="clearFields()"><i class="ti ti-rotate-clockwise" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></i> Clear</button></div>
    </div>

    <div class="button-stack">
        <button class="btn-convert" onclick="generateSmali()">⚡ Convert to Smali</button>
        <button class="btn-test" onclick="testToast()">🔔 Test Toast</button>
        <button class="btn-copy" onclick="copyCode()">📋 Copy Smali</button>
    </div>

    <div class="output-box" id="output"># Smali code will appear here...</div>

    <div class="footer-text">Developed by SB DARK CYBER 2.5 officials team © 2026</div>

</div>

<script>
    // Clear input and output
    function clearFields() {
        document.getElementById('msgInput').value = '';
        document.getElementById('output').textContent = '# Smali code will appear here...';
    }

    // ১. স্মালি কোড জেনারেটর
    function generateSmali() {

        const msg = document.getElementById('msgInput').value || "Hello from MI TEAM!";

        const smali = `# ==============================
# CODED BY :: SB DARK TEAM
# MODE : UNIVERSAL SMALI
# ==============================

const/4 v0, 0x1
const-string v1, "${msg}"

# Create Toast
invoke-static {p0, v1, v0}, Landroid/widget/Toast;->makeText(Landroid/content/Context;Ljava/lang/CharSequence;I)Landroid/widget/Toast;

move-result-object v0

# Show Toast
invoke-virtual {v0}, Landroid/widget/Toast;->show()V`;

        document.getElementById('output').textContent = smali;

        if (navigator.vibrate) {
            navigator.vibrate(50);
        }
    }

    // ২. টোস্ট টেস্ট
    function testToast() {

        const msg = document.getElementById('msgInput').value || "Hello from MI TEAM!";

        alert(msg);
    }

    // ৩. কপি ফাংশন
    function copyCode() {

        const code = document.getElementById('output').textContent;

        if(code.includes("#")) {

            const tempInput = document.createElement("textarea");

            tempInput.value = code;

            document.body.appendChild(tempInput);

            tempInput.select();

            document.execCommand("copy");

            document.body.removeChild(tempInput);

            alert("Smali Code Copied!");

        } else {

            alert("Please generate code first!");
        }
    }
</script>

<style>

html, body {
    background: transparent !important;
}

#md-baijid-background {
    position: fixed !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    overflow: hidden !important;
    background: #050a14 !important;
    pointer-events: none !important;
    z-index: -1 !important;
}

#md-baijid-matrix {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050a14;
    z-index: 1;
}

#md-baijid-matrix .md-baijid-rain {
    position: absolute;
    top: 0;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
}

#md-baijid-matrix .md-baijid-track {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    transform: translate3d(0,-50%,0);
    animation: mdBaijidMatrixDown linear infinite;
    will-change: transform;
    backface-visibility: hidden;
}

@keyframes mdBaijidMatrixDown {
    from { transform: translate3d(0,-50%,0); }
    to { transform: translate3d(0,0,0); }
}

#md-baijid-matrix .md-baijid-stream {
    display: flex;
    flex-direction: column;
    width: 100%;
    flex-shrink: 0;
}

#md-baijid-matrix .md-baijid-stream span {
    display: block;
    height: 22px;
    line-height: 22px;
    font-size: 17px;
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
    color: rgba(57,255,136,.58);
    text-shadow:
        0 0 2px rgba(57,255,136,.40),
        0 0 5px rgba(57,255,136,.12);
    flex-shrink: 0;
}

#md-baijid-matrix .md-baijid-stream span:nth-child(3n) { opacity: .82; }
#md-baijid-matrix .md-baijid-stream span:nth-child(5n) { opacity: .70; }
#md-baijid-matrix .md-baijid-stream span:nth-child(7n) { opacity: .56; }
#md-baijid-matrix .md-baijid-stream span:nth-child(11n) { opacity: .44; }
#md-baijid-matrix .md-baijid-stream span:nth-child(17n) { opacity: .32; }

#md-baijid-names {

    inset: 0;
    overflow: hidden;
    pointer-events: none;

}

@keyframes mdBaijidNameDown {

    }

</style>

<script>
(function() {

    "use strict";

    var matrix = document.getElementById("md-baijid-matrix");

    if (!matrix || matrix.dataset.started === "true") {
        return;
    }

    matrix.dataset.started = "true";

    var columnWidth = 30;
    var lineHeight = 22;

    function createStream() {

        var stream = document.createElement("div");

        stream.className = "md-baijid-stream";

        var count = Math.ceil(
            window.innerHeight / lineHeight
        ) + 20;

        var chars = "12345678900000000000aabcdkacskvslvjsjkshbskbsjksvjakvjwhs";

        for (var i = 0; i < count; i++) {

            var span = document.createElement("span");

            span.textContent = chars.charAt(
                Math.floor(Math.random() * chars.length)
            );

            stream.appendChild(span);
        }

        return stream;
    }

    function createMatrix() {

        matrix.innerHTML = "";

        var columns = Math.ceil(
            window.innerWidth / columnWidth
        );

        for (var i = 0; i < columns; i++) {

            var rain = document.createElement("div");

            rain.className = "md-baijid-rain";

            rain.style.left = (i * columnWidth) + "px";
            rain.style.width = columnWidth + "px";

            var stream1 = createStream();
            var stream2 = stream1.cloneNode(true);

            var track = document.createElement("div");

            track.className = "md-baijid-track";

            track.appendChild(stream1);
            track.appendChild(stream2);

            var duration = 6.2 + Math.random() * 2.4;

            track.style.animationDuration = duration + "s";

            track.style.animationDelay =
                (-Math.random() * duration) + "s";

            rain.appendChild(track);

            matrix.appendChild(rain);
        }
    }

    createMatrix();

    var resizeTimer = null;

    window.addEventListener("resize", function() {

        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(function() {
            createMatrix();
        }, 250);

    });

})();
</script>
